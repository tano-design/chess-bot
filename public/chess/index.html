<!doctype html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>TANOMATE test page</title>
  <style>
    html { background: #191919; color: rgba(255,255,255,.85); }
    html[data-theme="light"] { background: #D9D9D9; color: rgba(25,25,25,.9); }
    body { margin: 0; padding: 1.5rem; font: 15px/1.4 "Helvetica Neue", Helvetica, Arial, sans-serif; transition: background .4s; }
    button#theme-toggle { font: inherit; background: none; color: inherit; border: 1px solid currentColor; padding: 6px 10px; cursor: pointer; margin-bottom: 1.5rem; }
    main { max-width: 1100px; margin: 0 auto; }
  </style>
</head>
<body>
  <main>
    <button id="theme-toggle" onclick="var r=document.documentElement;r.setAttribute('data-theme',r.getAttribute('data-theme')==='light'?'dark':'light')">Light / dark</button>
    <div data-tano-chess></div>
  </main>
  <script src="/chess/embed.js" defer></script>
</body>
</html>
